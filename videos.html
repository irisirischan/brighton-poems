<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brighton, Mass — Videos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; color: #fff; background: #111; }

  header {
    padding: 60px 20px 20px;
    text-align: center;
  }

  h1 {
    font-size: 2.2rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: normal;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  figure { margin-bottom: 48px; }

  figcaption {
    font-size: 1.25rem;
    font-style: italic;
    margin-bottom: 12px;
    text-align: center;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
  }

  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 8px;
  }

  a.back {
    display: block;
    text-align: center;
    color: #bbb;
    font-style: italic;
    text-decoration: none;
    margin-top: 20px;
  }
  a.back:hover { color: #fff; }
</style>
</head>
<body>

<header>
  <h1>Brighton, in Video</h1>
</header>

<main>
  <figure>
    <figcaption>Living in Brighton, MA: The Ultimate Local Guide | Homes.com</figcaption>
    <div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/X4nIZ8o21JA"
        title="Living in Brighton, MA: The Ultimate Local Guide"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </div>
  </figure>

  <figure>
    <figcaption>Brighton Massachusetts | 4K Scenic Neighborhood Driving Tour</figcaption>
    <div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/wETF6KhV5j8"
        title="Brighton Massachusetts | 4K Scenic Neighborhood Driving Tour"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </div>
  </figure>

  <a class="back" href="index.html">← Back to the poems</a>
</main>

</body>
</html>
